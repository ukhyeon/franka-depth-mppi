<rect x="872" y="210" width="290" height="103" rx="12" fill="#e7f0ff" stroke="#2a78d6"/><text x="1017" y="242" font-size="19" font-weight="bold">Actual MPPI optimizer</text><text x="1017" y="270" font-size="16">C = C_existing + α C_hand</text><text x="1017" y="294" font-size="15">α = 1; baseline: no extra term</text>
<rect x="890" y="423" width="252" height="80" rx="12" fill="#e9edf2" stroke="#a2acb8"/><text x="1016" y="454" font-size="18" font-weight="bold">Isaac Sim Franka</text><text x="1016" y="480" font-size="15">Joint command → measured q, q̇</text>
<text x="1016" y="582" font-size="14">Measured state via existing filter</text>
<text x="38" y="580" text-anchor="start" font-size="14">ROI is manually specified. No body-part recognition or actual collision-force prediction.</text>
