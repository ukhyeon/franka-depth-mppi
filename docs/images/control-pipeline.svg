<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#526276"/></marker></defs>
<rect width="1200" height="610" fill="#fafbfd"/>
<g font-family="sans-serif" fill="#172b4d"><text x="38" y="43" font-size="26" font-weight="bold">Depth-driven MPPI with an additional hand-ROI cost</text><text x="38" y="72" font-size="16">Green: existing mapping / cuRobo costs     Blue: project additions     Grey: simulation and input</text></g>
<g stroke="#526276" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M210 178H262"/><path d="M210 178H235V340H262"/><path d="M485 178H538"/><path d="M485 340H538"/><path d="M775 178H827V253H870"/><path d="M775 340H827V280H870"/><path d="M655 450V390"/><path d="M1000 313V423"/><path d="M1016 503V552H1180V260H1162"/></g>
<g font-family="sans-serif" text-anchor="middle" fill="#172b4d">
<rect x="30" y="125" width="180" height="105" rx="12" fill="#e9edf2" stroke="#a2acb8"/><text x="120" y="156" font-size="18" font-weight="bold">D435i / replay</text><text x="120" y="183" font-size="15">Depth + intrinsics</text><text x="120" y="206" font-size="15">Camera-to-world pose</text>
<rect x="265" y="125" width="220" height="105" rx="12" fill="#e3f6ee" stroke="#23a374"/><text x="375" y="157" font-size="18" font-weight="bold">nvblox occupancy</text><text x="375" y="184" font-size="15">ESDF + GPU hash updates</text><text x="375" y="207" font-size="15">3 cm voxels</text>
<rect x="540" y="112" width="235" height="132" rx="12" fill="#e3f6ee" stroke="#23a374"/><text x="657" y="143" font-size="18" font-weight="bold">Existing costs</text><text x="657" y="171" font-size="15">nvblox + fixed primitives</text><text x="657" y="194" font-size="15">Self collision + goal pose</text><text x="657" y="217" font-size="15">Joint bounds + stop cost</text>
<rect x="265" y="287" width="220" height="105" rx="12" fill="#e7f0ff" stroke="#2a78d6"/><text x="375" y="319" font-size="18" font-weight="bold">Manual hand ROI</text><text x="375" y="347" font-size="15">Observed point patches</text><text x="375" y="370" font-size="15">1 mm cuboids, max 64</text>
<rect x="540" y="287" width="235" height="105" rx="12" fill="#e7f0ff" stroke="#2a78d6"/><text x="657" y="319" font-size="18" font-weight="bold">Separate target checker</text><text x="657" y="347" font-size="15">PrimitiveCollisionCost</text><text x="657" y="370" font-size="15">Same MPPI candidate spheres</text>
